    function spawnZombieAtBurrow(){
      if(zombiesToSpawnRemaining<=0||isGameOver)return;
      let playerInBasement = (playerRig.position.y < -40);
      let av=allBurrowHoles.filter(h=>{
        if(!playerInBasement && h.globalY < -40) return false;
        if(playerInBasement && h.globalY > -40) return false;
        if(!unlockedDoors[0])return h.globalZ>-25;
        if(!unlockedDoors[1])return h.globalZ>-65;

        if(!unlockedDoors[3])return h.globalZ>-255;

        if(isHost) socket.emit('sync_hole_dig', { holeIndex: hIdx, dirtCount: th.dirtCount });
        return;
      }
      const zd=createZombieMesh();
      zd.group.position.set(th.globalX,th.globalY,th.globalZ);
      scene.add(zd.group);

      while(activeZombies.length > networkZombies.length) {
        const removed = activeZombies.pop();
        scene.remove(removed.meshParts.group);
      }
      networkZombies.forEach((nz, idx) => {
        const localZ = activeZombies[idx];
        if (localZ) {
          localZ.meshParts.group.position.set(nz.x, nz.y, nz.z);
          localZ.meshParts.group.rotation.y = nz.yaw;

          activeZombies.forEach(z => {
            if(!z.deadAndShrinking && z.emergenceStage === 3){
              let d = machineGroup.position.distanceTo(z.meshParts.group.position);
              if(d < minD){ minD = d; nz = z; }
            }
          });
          if(nz){
            let ld = new V3().subVectors(nz.meshParts.group.position, machineGroup.position);
            ld.y = 0; ld.normalize();
            machineGroup.rotation.y = Math.atan2(ld.x, ld.z);
          } else if(rd.length() > 0.8){
            rd.normalize();
            machineGroup.position.addScaledVector(rd, 0.45);
            machineGroup.rotation.y = Math.atan2(rd.x, rd.z);
            mainWheelMesh.rotation.x += 0.3;
          } else {
            machineGroup.rotation.y = playerYaw;
          }
        } else {
          let diff = new V3().subVectors(robotAIState.target, machineGroup.position);
          if(diff.length() < 1.5) robotAIState.target = getNewUpperLevelTarget();
          else {
            diff.normalize();
            machineGroup.position.addScaledVector(diff, robotAIState.speed);
            machineGroup.rotation.y = Math.atan2(diff.x, diff.z);
            machineGroup.rotation.x = 0;
            machineGroup.rotation.z = 0;
          }
        }
      }

      if(elevatorActive){
        elevatorProgress = (elevatorDirection === -1) ? Math.min(elevatorProgress + 0.005, 1) : Math.max(elevatorProgress - 0.005, 0);
        secretGalleryGroup.position.y = 0.2 - elevatorProgress * 80;
        if(playerRig.position.x >= -15 && playerRig.position.x <= 15 && playerRig.position.z >= -345 && playerRig.position.z <= -315) playerRig.position.y = secretGalleryGroup.position.y + 3;
        if(elevatorProgress >= 1 || elevatorProgress <= 0) elevatorActive = false;
      }

      chassis.position.y = 3.6 + Math.sin(t * 0.01) * 0.04;

      let moveSpeed = hasStaminUp ? 18.0 : 12.0;
      if(playerRig.position.z < -275 && playerRig.position.z > -385 && playerRig.position.x > -55 && playerRig.position.x < 55 && !secretPermanentlyOpen && playerRig.position.y <= 3.5 && playerRig.position.y > -40){
        moveSpeed = 4.0;
      }

      let mv = new V3(0,0,0);
      if(keys.w) mv.z -= 1;
      if(keys.s) mv.z += 1;
      if(keys.a) mv.x -= 1;
      if(keys.d) mv.x += 1;
      mv.normalize().applyQuaternion(playerRig.quaternion);
      mv.y = 0;

      mirrorMesh.visible = false;
      renderer.setRenderTarget(mirrorRenderTarget);
      renderer.render(scene, mirrorCamera);
      renderer.setRenderTarget(null);
      mirrorMesh.visible = true;

      if(playerRig.position.y > -75 && playerRig.position.z < -315 && playerRig.position.z > -345 && playerRig.position.x > -15 && playerRig.position.x < 15){
        if(!elevatorActive){
          if(!secretPermanentlyOpen){
            if(playerRig.position.y > 3.5) playerRig.position.y = 3;
          } else {
            playerRig.position.y = secretGalleryGroup.position.y + 3;
          }
        }
      }

      let np = playerRig.position.clone().addScaledVector(mv, moveSpeed * delta);
      checkWallCollisions(np);
      playerRig.position.copy(np);

      if(elevatorActive && playerRig.position.z >= -345 && playerRig.position.z <= -315 && playerRig.position.x >= -15 && playerRig.position.x <= 15){
        playerRig.position.x = Math.max(-13.5, Math.min(13.5, playerRig.position.x));
        playerRig.position.z = Math.max(-343.5, Math.min(-316.5, playerRig.position.z));
      }

      if(!elevatorActive){
        secretProgress = secretActive ? Math.min(secretProgress + 0.01, 1) : Math.max(secretProgress - 0.01, 0);
        waterLeftMesh.position.x = -27.5 - secretProgress * 55;
        waterRightMesh.position.x = 27.5 + secretProgress * 55;
        secretGalleryGroup.position.y = secretPermanentlyOpen ? (-17 + secretProgress * 17.2) : -17;
      }

      if(playerRig.position.y < -40) scene.background = caveBG;
      else if(!elevatorActive && playerRig.position.z <= -275 && playerRig.position.z >= -385 && playerRig.position.x >= -55 && playerRig.position.x <= 55 && keys.shift && !secretPermanentlyOpen){
        playerRig.position.y += (-12 - playerRig.position.y) * 0.1;
        scene.background = underwaterBG;
      } else if(playerRig.position.y > -5){
        playerRig.position.y += (3 - playerRig.position.y) * 0.1;
        scene.background = defaultBG;
      }

      simulateStickmanMatch(t);

      if(now - lastNetSendTime > 33){
        lastNetSendTime = now;
        socket.emit('player_update', {
          x: playerRig.position.x,
          y: playerRig.position.y,
          z: playerRig.position.z,
          yaw: playerYaw,
          pitch: playerPitch
        });
      }

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate(0);
  </script>
</body>
</html>
