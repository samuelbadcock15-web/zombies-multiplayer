<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Haunted Mansion Vault - 4-Slot Co-op Lobby</title>
  <style>
    body { margin: 0; background: #0c0806; color: #fff; font-family: monospace; overflow: hidden; width: 100vw; height: 100vh; }
    canvas { display: block; width: 100%; height: 100%; }
    #gui { position: absolute; inset: 0; pointer-events: none; z-index: 10; display: none; }
    #stats { position: absolute; top: 20px; left: 20px; font-size: 13px; font-weight: 700; background: rgba(30,20,15,.9); color: #d4af37; padding: 8px 12px; border: 1px solid #6b4c35; line-height: 1.4; }
    #score-board { position: absolute; top: 20px; right: 20px; font-size: 20px; font-weight: 700; background: #140d0a; color: #fa0; padding: 10px 20px; border: 2px solid #8b5a2b; pointer-events: auto; }
    #team-hud { position: absolute; top: 80px; right: 20px; background: rgba(20,13,10,0.85); border: 1px solid #8b5a2b; padding: 8px 14px; font-size: 13px; line-height: 1.6; }
    #round-display { position: absolute; bottom: 40px; left: 20px; font-size: 48px; font-weight: 700; color: #c22; text-shadow: 2px 2px #000; }
    #msg-box { position: absolute; bottom: 40px; width: 100%; text-align: center; left: 0; }
    #text { display: inline-block; background: rgba(35,24,18,.95); color: #f0e0d0; border: 2px solid #8b5a2b; padding: 12px 20px; min-width: 320px; font-weight: 700; text-transform: uppercase; box-shadow: 0 4px 10px rgba(0,0,0,.5); }
    #crosshair { position: absolute; top: 50%; left: 50%; width: 10px; height: 10px; transform: translate(-50%,-50%); pointer-events: none; }
    #crosshair::after,#crosshair::before { content:''; position: absolute; background: #fa0; }
    #crosshair::before { top: 4px; left: -10px; width: 30px; height: 2px; }
    #crosshair::after { top: -10px; left: 4px; width: 2px; height: 30px; }
    #damage-overlay { position: absolute; inset: 0; background: rgba(255,0,0,0); pointer-events: none; transition: background .1s ease; z-index: 5; }

    /* Numbered 4-Slot Lobby UI */
    #lobby-screen { position: absolute; inset: 0; background: radial-gradient(circle, #24140d 0%, #0c0806 90%); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
    .lobby-header { font-size: 26px; color: #d4af37; font-weight: 900; margin-bottom: 15px; letter-spacing: 2px; text-shadow: 0 0 10px rgba(212,175,55,0.4); text-align: center; }
    .input-box { background: #140c08; border: 1px solid #6b4c35; color: #fff; padding: 10px; font-size: 16px; font-family: monospace; text-transform: uppercase; text-align: center; margin-bottom: 20px; width: 260px; }
    
    #lobbies-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; max-width: 950px; width: 90%; }
    .lobby-box { background: rgba(20,13,10,0.95); border: 2px solid #8b5a2b; border-radius: 6px; padding: 15px; display: flex; flex-direction: column; box-shadow: 0 4px 15px rgba(0,0,0,0.6); }
    .lobby-box-title { font-size: 18px; color: #fa0; font-weight: bold; border-bottom: 1px solid #4a3324; padding-bottom: 8px; margin-bottom: 12px; display: flex; justify-content: space-between; }
    
    .slot-row { background: #120a07; border: 1px solid #3a2418; padding: 8px 10px; margin-bottom: 8px; font-size: 13px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; border-radius: 4px; }
    .slot-open { color: #665544; border-style: dashed; }
    .status-ready { color: #00ff66; font-weight: 900; }
    .status-waiting { color: #ffaa00; }

    .btn { background: #8b5a2b; color: #fff; border: none; padding: 10px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: monospace; text-transform: uppercase; margin-top: 8px; border-radius: 4px; }
    .btn:hover { background: #b8793b; }
    .btn-ready { background: #2e7d32; font-size: 16px; padding: 14px; }
    .btn-ready:hover { background: #388e3c; }
    .btn-leave { background: #8b2b2b; }
    .btn-leave:hover { background: #b83b3b; }

    #room-view { display: none; background: rgba(20,13,10,0.95); border: 2px solid #8b5a2b; border-radius: 6px; padding: 25px 40px; width: 440px; text-align: center; }
  </style>
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="damage-overlay"></div>

  <!-- Lobby Screen -->
  <div id="lobby-screen">
    <!-- View 1: Lobby Browser -->
    <div id="browser-view" style="display: flex; flex-direction: column; align-items: center; width: 100%;">
      <div class="lobby-header">HAUNTED OUTBREAK<br><span style="font-size:15px;color:#fa0;">CHOOSE A SQUAD LOBBY (1-6)</span></div>
      <input id="player-name-input" class="input-box" maxlength="12" placeholder="ENTER YOUR CALLSIGN" value="MARINE">
      <div id="lobbies-container"></div>
    </div>

    <!-- View 2: Joined Lobby 4-Slot Room -->
    <div id="room-view">
      <div class="lobby-header" id="current-lobby-title">LOBBY 1</div>
      <div id="active-slots-container" style="margin-bottom: 20px;"></div>
      <button class="btn btn-ready" id="btn-toggle-ready">CLICK TO READY UP</button>
      <button class="btn btn-leave" id="btn-leave-lobby" style="margin-top: 10px;">LEAVE LOBBY</button>
    </div>
  </div>

  <!-- In-Game HUD -->
  <div id="gui">
    <div id="stats">WASD + LOOK | KEYS 1-5 SWITCH WEAPONS<br>SURVIVE THE HAUNTED OUTBREAK TOGETHER!</div>
    <div id="score-board">CREDITS: <span id="score-val">500</span></div>
    <div id="team-hud"><b style="color:#d4af37;">SQUAD STATUS</b><div id="team-list-hud"></div></div>
    <div id="round-display">ROUND <span id="round-val">I</span></div>
    <div id="crosshair"></div>
    <div id="msg-box"><div id="text">ALL SQUAD MEMBERS READY. MISSION COMMENCED!</div></div>
  </div>

  <!-- Canvas Textures -->
  <canvas id="virtualArcadeCanvas" style="display:none" width="512" height="512"></canvas>
  <canvas id="gunTacticalCanvas" style="display:none" width="512" height="512"></canvas>
  <canvas id="mysteryBoxScreenCanvas" style="display:none" width="512" height="512"></canvas>
  <canvas id="upgradeMachineScreenCanvas" style="display:none" width="512" height="512"></canvas>
  <canvas id="jugCanvas" style="display:none" width="512" height="512"></canvas>
  <canvas id="quickReviveCanvas" style="display:none" width="512" height="512"></canvas>
  <canvas id="doubleTapCanvas" style="display:none" width="512" height="512"></canvas>
  <canvas id="staminUpCanvas" style="display:none" width="512" height="512"></canvas>

  <script>
    const socket = io();
    let myLobbyId = null, mySlotNumber = null, myColor = null, isHost = false, gameActive = false;
    const remotePlayers = {}; // slotNumber -> { mesh, data }

    const $ = i => document.getElementById(i), T = THREE, V3 = T.Vector3, BG = (w,h,d)=>new T.BoxGeometry(w,h,d), CG = (rt,rb,h,s=16)=>new T.CylinderGeometry(rt,rb,h,s), PG = (w,h)=>new T.PlaneGeometry(w,h), SG = (r,s=16,p=16)=>new T.SphereGeometry(r,s,p), SM = m=>new T.MeshStandardMaterial(m), BM = m=>new T.MeshBasicMaterial(m), GRP = ()=>new T.Group();
    const MESH = (g,m,x=0,y=0,z=0,rx=0,ry=0)=>{ let o=new T.Mesh(g,m); o.position.set(x,y,z); if(rx)o.rotation.x=rx; if(ry)o.rotation.y=ry; return o; };
    const tacticalCanvas=$('gunTacticalCanvas'), tacticalCtx=tacticalCanvas.getContext('2d'), gunTacticalTexture=new T.CanvasTexture(tacticalCanvas);
    const txtDiv = $('text');

    // --- LOBBY BROWSER RENDERING ---
    socket.on('lobby_list', lobbies => {
      if (myLobbyId) {
        // We are currently in a room, render the room view
        const currentLobby = lobbies.find(l => l.id === myLobbyId);
        if (currentLobby) renderRoomSlots(currentLobby);
      } else {
        // Render lobby browser cards
        const cont = $('lobbies-container');
        cont.innerHTML = '';
        lobbies.forEach(lobby => {
          const card = document.createElement('div');
          card.className = 'lobby-box';
          
          let slotsHtml = '';
          for (let i = 0; i < 4; i++) {
            const slot = lobby.slots[i];
            if (slot) {
              slotsHtml += `<div class="slot-row" style="color:#${slot.color.toString(16).padStart(6,'0')};">
                <span>SLOT ${i+1}: ${slot.name}</span>
                <span class="${slot.ready ? 'status-ready':'status-waiting'}">${slot.ready ? 'READY':'WAITING'}</span>
              </div>`;
            } else {
              slotsHtml += `<div class="slot-row slot-open"><span>SLOT ${i+1}: [OPEN]</span><span>--</span></div>`;
            }
          }

          const isFull = lobby.playerCount >= 4;
          const isPlaying = lobby.started;
          const btnText = isPlaying ? 'IN PROGRESS' : (isFull ? 'FULL' : `JOIN LOBBY ${lobby.id}`);
          const btnDisabled = isFull || isPlaying;

          card.innerHTML = `
            <div class="lobby-box-title">
              <span>LOBBY ${lobby.id}</span>
              <span style="color:#fff;">${lobby.playerCount}/4</span>
            </div>
            ${slotsHtml}
            <button class="btn" ${btnDisabled ? 'disabled style="opacity:0.5;cursor:not-allowed;"':''} onclick="joinLobbySlot(${lobby.id})">${btnText}</button>
          `;
          cont.appendChild(card);
        });
      }
    });

    window.joinLobbySlot = (lobbyId) => {
      const name = $('player-name-input').value.trim() || 'MARINE';
      socket.emit('join_slot', { lobbyId, name });
    };

    socket.on('slot_joined', data => {
      myLobbyId = data.lobbyId;
      mySlotNumber = data.slotNumber;
      myColor = data.myColor;
      isHost = (mySlotNumber === 1);

      $('browser-view').style.display = 'none';
      $('room-view').style.display = 'block';
      $('current-lobby-title').innerText = `LOBBY ${myLobbyId} — SQUAD ROOM`;
    });

    function renderRoomSlots(lobby) {
      const cont = $('active-slots-container');
      cont.innerHTML = '';
      for (let i = 0; i < 4; i++) {
        const slot = lobby.slots[i];
        const isMe = (i + 1 === mySlotNumber);
        if (slot) {
          cont.innerHTML += `<div class="slot-row" style="color:#${slot.color.toString(16).padStart(6,'0')}; font-size:15px; padding:12px;">
            <span>SLOT ${i+1}: ${slot.name} ${isMe ? '(YOU)':''}</span>
            <span class="${slot.ready ? 'status-ready':'status-waiting'}">${slot.ready ? 'READY ✓':'WAITING...'}</span>
          </div>`;
          if (isMe) {
            $('btn-toggle-ready').innerText = slot.ready ? 'CANCEL READY' : 'CLICK TO READY UP';
            $('btn-toggle-ready').style.background = slot.ready ? '#8b5a2b' : '#2e7d32';
          }
        } else {
          cont.innerHTML += `<div class="slot-row slot-open" style="font-size:15px; padding:12px;"><span>SLOT ${i+1}: WAITING FOR PLAYER...</span><span>--</span></div>`;
        }
      }
    }

    $('btn-toggle-ready').onclick = () => { socket.emit('toggle_ready'); };
    $('btn-leave-lobby').onclick = () => {
      socket.emit('leave_slot');
      myLobbyId = null;
      mySlotNumber = null;
      $('room-view').style.display = 'none';
      $('browser-view').style.display = 'flex';
    };

    // --- GAME COMMENCEMENT ---
    socket.on('game_start', data => {
      $('lobby-screen').style.display = 'none';
      $('gui').style.display = 'block';
      gameActive = true;
      document.body.requestPointerLock();
      initAudio();

      data.players.forEach(p => {
        if (p.slotNumber !== mySlotNumber) {
          remotePlayers[p.slotNumber] = {
            data: p,
            mesh: createTeammateMesh(p.color, p.slotNumber)
          };
        }
      });
      updateTeamHUD();
      if (mySlotNumber === 1) startRound(1);
    });

    function createTeammateMesh(colorHex, slotNum) {
      const g = GRP();
      const suitMat = SM({ color: 0x2b332b, roughness: 0.7 });
      const accentMat = SM({ color: colorHex, metalness: 0.8, roughness: 0.2 });

      g.add(MESH(BG(0.9, 1.3, 0.5), suitMat, 0, 1.8, 0));
      g.add(MESH(BG(0.94, 0.6, 0.54), accentMat, 0, 2.0, 0));
      g.add(MESH(BG(0.6, 0.6, 0.6), suitMat, 0, 2.8, 0));
      g.add(MESH(BG(0.45, 0.2, 0.1), BM({ color: colorHex }), 0, 2.8, 0.31));

      const gunMesh = buildWeaponGeometry(1, false);
      gunMesh.position.set(0.4, 1.7, 0.5);
      gunMesh.scale.setScalar(1.4);
      g.add(gunMesh);

      scene.add(g);
      return g;
    }

    function updateTeamHUD() {
      const el = $('team-list-hud');
      el.innerHTML = `<div style="color:#${myColor.toString(16).padStart(6,'0')};">• Slot ${mySlotNumber} (You)</div>`;
      Object.values(remotePlayers).forEach(rp => {
        el.innerHTML += `<div style="color:#${rp.data.color.toString(16).padStart(6,'0')};">• Slot ${rp.data.slotNumber}: ${rp.data.name}</div>`;
      });
    }

    socket.on('remote_player_update', data => {
      if (remotePlayers[data.slotNumber]) {
        const rp = remotePlayers[data.slotNumber];
        rp.mesh.position.set(data.x, data.y - 3.0, data.z);
        rp.mesh.rotation.y = data.yaw;
      }
    });

    socket.on('player_left', slotNum => {
      if (remotePlayers[slotNum]) {
        scene.remove(remotePlayers[slotNum].mesh);
        delete remotePlayers[slotNum];
        updateTeamHUD();
      }
    });

    // --- GAME ENGINE & THREE.JS ---
    let playerPoints = 500, currentWeapon = 1, playerBites = 0, maxBites = 3, isGameOver = false, currentRound = 1, zombiesToSpawnRemaining = 0, roundActive = false, lastSpawnTime = 0, spawnInterval = 2500;
    let baseWeaponData = { 1:{name:"PISTOL",damage:1,maxAmmo:200,range:60,headDamage:3}, 2:{name:"AUTO PISTOL",damage:1,maxAmmo:200,range:60,headDamage:3}, 3:{name:"SHOTGUN",damage:2,maxAmmo:150,range:80,headDamage:5}, 4:{name:"RIFLE",damage:2,maxAmmo:150,range:75,headDamage:4}, 5:{name:"RAY GUN",damage:10,maxAmmo:100,range:140,headDamage:25} };
    let ammoReserves = { 1: 200, 2: 0, 3: 0, 4: 0, 5: 0 }, isLmbHeldDown = false, lastShotTime = 0;

    function addPoints(a){ playerPoints += a; $('score-val').innerText = playerPoints; }
    function toRoman(n){ const l={M:1000,D:500,C:100,L:50,X:10,V:5,I:1}; let r=''; for(let i in l){while(n>=l[i]){r+=i;n-=l[i]}} return r||"I"; }

    function updateTacticalHUD(){
      let cur=ammoReserves[currentWeapon],max=baseWeaponData[currentWeapon].maxAmmo,pct=cur/max,c=tacticalCtx;
      c.fillStyle='#21140e';c.fillRect(0,0,512,512);c.strokeStyle='#b8860b';c.lineWidth=12;c.strokeRect(10,10,492,492);
      c.fillStyle='#ffd700';c.font='bold 22px monospace';c.fillText("AMMO",30,42);c.fillStyle='#fff';c.font='900 76px monospace';c.fillText(cur<10?`00${cur}`:`${cur}`,30,110);
      c.fillStyle='#3a2418';c.fillRect(30,135,452,26);c.fillStyle='#fa0';c.fillRect(34,139,444*pct,18);
      gunTacticalTexture.needsUpdate=true;
    }

    function damagePlayer(){
      if(isGameOver)return;
      playerBites++;updateTacticalHUD();
      $('damage-overlay').style.backgroundColor="rgba(255,0,0,0.4)";
      setTimeout(()=>{$('damage-overlay').style.backgroundColor="rgba(255,0,0,0)"},150);
      if(playerBites>=maxBites){
        isGameOver=true;document.exitPointerLock();
        txtDiv.innerHTML="DOWNED! SPECTATING SQUAD...";
      }
    }

    function buildWeaponGeometry(id,upg){
      const g=GRP();let fm=SM({color:0x3a2e25,metalness:0.6,roughness:0.4}),am=SM({color:0xffd700,metalness:0.7});
      if(id===1){let r=MESH(BG(0.08,0.14,0.3),fm),gp=MESH(BG(0.07,0.16,0.08),fm,0,-0.12,-0.06,-0.2);g.add(r,gp);}
      else if(id===3){let r=MESH(BG(0.12,0.18,0.6),fm),b=MESH(CG(0.04,0.04,0.8,12),am,0,0.04,0.6,Math.PI/2);g.add(r,b);}
      else {let bd=MESH(BG(0.1,0.18,0.6),fm),b=MESH(CG(0.018,0.018,0.5),fm,0,0.02,0.85,Math.PI/2);g.add(bd,b);}
      return g;
    }

    function switchWeapon(id){
      currentWeapon=id;
      while(gunMeshGroup.children.length>0)gunMeshGroup.remove(gunMeshGroup.children[0]);
      gunMeshGroup.add(buildWeaponGeometry(currentWeapon,false));
      let h=MESH(BG(0.09*1.3,0.11*1.3,0.015*1.3),SM({color:0x2b1d14}),-0.048,0.07,-0.02,0,-Math.PI/2);
      let f=MESH(PG(0.082*1.3,0.102*1.3),BM({map:gunTacticalTexture,toneMapped:false}),0,0,0.01);
      h.add(f);gunMeshGroup.add(h);
      updateTacticalHUD();
    }

    document.body.addEventListener('click',()=>{if(gameActive&&!isGameOver&&document.pointerLockElement!==document.body)document.body.requestPointerLock();});

    let audioCtx=null;const scene=new T.Scene(),defaultBG=new T.Color(0x120d0a);scene.background=defaultBG;
    const camera=new T.PerspectiveCamera(65,window.innerWidth/window.innerHeight,0.1,1000);camera.rotation.order='YXZ';
    const playerRig=GRP();playerRig.position.set(0,3,15);scene.add(playerRig);
    const cameraPitchObject=GRP();playerRig.add(cameraPitchObject);cameraPitchObject.add(camera);
    const pistolGroup=GRP();pistolGroup.position.set(0.28,-0.28,-0.55);cameraPitchObject.add(pistolGroup);
    const gunMeshGroup=GRP();pistolGroup.add(gunMeshGroup);
    const muzzleFlash=new T.PointLight(0xffaa00,0,10);pistolGroup.add(muzzleFlash);
    let playerYaw=0,playerPitch=0;const raycaster=new T.Raycaster();

    scene.add(new T.AmbientLight(0xffeedd,1.4));
    const sunLight=new T.DirectionalLight(0xfff5ee,1);sunLight.position.set(30,60,30);scene.add(sunLight);

    function initAudio(){if(audioCtx)return;audioCtx=new(window.AudioContext||window.webkitAudioContext)();}
    function playPistolShotSound(){if(!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='triangle';o.frequency.setValueAtTime(400,audioCtx.currentTime);o.frequency.exponentialRampToValueAtTime(10,audioCtx.currentTime+0.1);g.gain.setValueAtTime(0.25,audioCtx.currentTime);g.gain.linearRampToValueAtTime(0.01,audioCtx.currentTime+0.1);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+0.1);}

    // Environment Meshes
    function createHauntedWoodFloorTexture(){const c=document.createElement('canvas');c.width=c.height=512;const ctx=c.getContext('2d');ctx.fillStyle='#4a3324';ctx.fillRect(0,0,512,512);const tex=new T.CanvasTexture(c);tex.wrapS=tex.wrapT=T.RepeatWrapping;tex.repeat.set(4,4);return tex;}
    const floorMat=SM({map:createHauntedWoodFloorTexture(),roughness:0.5}),wallMat=SM({color:0x5c4033,roughness:0.6}),ceilingMat=SM({color:0x332218,roughness:0.8});
    
    function addStructuralMesh(geo,mat,px,py,pz,rx=0,ry=0){const m=MESH(geo,mat,px,py,pz,rx,ry);scene.add(m);return m;}
    addStructuralMesh(PG(50,50),floorMat,0,0,0,-Math.PI/2,0);addStructuralMesh(PG(50,50),ceilingMat,0,16,0,Math.PI/2,0);
    addStructuralMesh(PG(150,150),floorMat,0,0,-140,-Math.PI/2,0);addStructuralMesh(PG(150,150),ceilingMat,0,30,-140,Math.PI/2,0);
    addStructuralMesh(PG(150,150),floorMat,0,0,-330,-Math.PI/2,0);addStructuralMesh(PG(150,150),ceilingMat,0,30,-330,Math.PI/2,0);

    // Shared Doors
    let unlockedDoors=[false,false,false,false],barrierMat=SM({color:0xaa2222,transparent:true,opacity:0.6});
    let doorArray=[-24.8,-64.8,-214.8,-254.8].map((z,i)=>{let d=MESH(BG(12,16,0.4),barrierMat,0,8,z);scene.add(d);d.userData={doorIndex:i};return d;});
    
    socket.on('door_unlocked', data => {
      unlockedDoors[data.doorIndex] = true;
      scene.remove(doorArray[data.doorIndex]);
      txtDiv.innerHTML = `DOOR ${data.doorIndex + 1} UNLOCKED BY SQUAD!`;
    });

    // Zombies
    const activeZombies=[], zombieInteractiveMeshes=[];
    function createZombieMesh(){
      const zg=GRP(),sm=SM({color:0x5a7360}),ct=SM({color:0x4a2323});
      const hb=MESH(BG(0.7,0.7,0.7),sm,0,2.4,0);hb.userData={hitBoxPart:"head"};
      const bo=MESH(BG(1.2,1.8,0.7),ct,0,1.0,0);bo.userData={hitBoxPart:"torso"};
      zg.add(hb,bo);return zg;
    }

    function rebuildZombieHitboxes(){
      zombieInteractiveMeshes.length=0;
      activeZombies.forEach((zb,idx)=>{
        if(!zb.deadAndShrinking){
          zb.mesh.traverse(c=>{
            if(c.isMesh){c.userData.parentZombieIndex=idx;zombieInteractiveMeshes.push(c);}
          });
        }
      });
    }

    function spawnZombie(x,y,z){
      const zm = createZombieMesh();
      zm.position.set(x,y,z);
      scene.add(zm);
      activeZombies.push({ mesh: zm, stage: 3, speed: 0.08, deadAndShrinking: false });
      rebuildZombieHitboxes();
    }

    function startRound(r){
      currentRound = r;
      $('round-val').innerText = toRoman(currentRound);
      zombiesToSpawnRemaining = 4 + Math.floor(currentRound * 2.5);
      roundActive = true;
    }

    function checkRoundEnd(){
      if(!roundActive) return;
      if(zombiesToSpawnRemaining === 0 && activeZombies.filter(z=>!z.deadAndShrinking).length === 0){
        roundActive = false;
        setTimeout(()=>{ if(!isGameOver && mySlotNumber === 1) startRound(currentRound + 1); }, 4000);
      }
    }

    socket.on('client_zombie_sync', data => {
      if (mySlotNumber === 1) return;
      while(activeZombies.length < data.length) spawnZombie(0,0,0);
      while(activeZombies.length > data.length) {
        const removed = activeZombies.pop();
        scene.remove(removed.mesh);
      }
      data.forEach((zd, i) => {
        if (activeZombies[i]) {
          activeZombies[i].mesh.position.set(zd.x, zd.y, zd.z);
          activeZombies[i].mesh.rotation.y = zd.yaw;
          activeZombies[i].stage = zd.stage;
        }
      });
      rebuildZombieHitboxes();
    });

    socket.on('host_apply_zombie_hit', data => {
      if (mySlotNumber !== 1) return;
      const tz = activeZombies[data.zombieIndex];
      if (tz && !tz.deadAndShrinking) {
        tz.stage -= data.damage;
        if (tz.stage <= 0) {
          tz.deadAndShrinking = true;
          scene.remove(tz.mesh);
          if (data.shooterSlot === mySlotNumber) addPoints(20);
        }
      }
    });

    function executeWeaponFireRaycast(){
      if(isGameOver)return;
      raycaster.setFromCamera(new T.Vector2(0,0),camera);

      let dh = raycaster.intersectObjects(doorArray.filter((d,i)=>!unlockedDoors[i]));
      if(dh.length>0&&dh[0].distance<12){
        let di = dh[0].object.userData.doorIndex;
        if(playerPoints>=50){
          playerPoints-=50; $('score-val').innerText=playerPoints;
          socket.emit('unlock_door', di);
        } else txtDiv.innerHTML="DOOR COSTS 50 CREDITS.";
        return;
      }

      if(ammoReserves[currentWeapon]<=0){txtDiv.innerHTML="OUT OF AMMO!";return;}
      ammoReserves[currentWeapon]--; updateTacticalHUD(); playPistolShotSound();
      muzzleFlash.intensity=5; pistolGroup.position.z+=0.1; setTimeout(()=>{muzzleFlash.intensity=0;pistolGroup.position.z-=0.1;},45);

      let zh = raycaster.intersectObjects(zombieInteractiveMeshes, true);
      if(zh.length>0){
        let isH = (zh[0].object.userData.hitBoxPart==="head");
        let zIdx = zh[0].object.userData.parentZombieIndex;
        socket.emit('zombie_hit', {
          zombieIndex: zIdx,
          damage: isH ? baseWeaponData[currentWeapon].headDamage : baseWeaponData[currentWeapon].damage,
          isHeadshot: isH
        });
      }
    }

    // Input Controls
    window.addEventListener('mousemove',e=>{
      if(document.pointerLockElement!==document.body||isGameOver)return;
      playerYaw -= e.movementX*0.0025; playerRig.rotation.y = playerYaw;
      playerPitch = Math.max(-1.4,Math.min(1.4,playerPitch - e.movementY*0.0025)); cameraPitchObject.rotation.x = playerPitch;
    });

    window.addEventListener('mousedown',e=>{
      if(document.pointerLockElement!==document.body||isGameOver)return;
      if(e.button===0){ isLmbHeldDown=true; executeWeaponFireRaycast(); lastShotTime=performance.now(); }
    });
    window.addEventListener('mouseup',e=>{ if(e.button===0) isLmbHeldDown=false; });

    const keys={w:0,a:0,s:0,d:0};
    window.addEventListener('keydown',e=>{
      if(isGameOver)return;
      if(e.code==='KeyW')keys.w=1;if(e.code==='KeyS')keys.s=1;if(e.code==='KeyA')keys.a=1;if(e.code==='KeyD')keys.d=1;
      if(e.code==='Digit1')switchWeapon(1);if(e.code==='Digit2')switchWeapon(2);if(e.code==='Digit3')switchWeapon(3);
    });
    window.addEventListener('keyup',e=>{
      if(e.code==='KeyW')keys.w=0;if(e.code==='KeyS')keys.s=0;if(e.code==='KeyA')keys.a=0;if(e.code==='KeyD')keys.d=0;
    });

    const renderer=new T.WebGLRenderer({antialias:true});
    renderer.setSize(window.innerWidth,window.innerHeight);
    document.body.appendChild(renderer.domElement);
    switchWeapon(1);

    let lastNetSendTime = 0;

    function animate(t){
      requestAnimationFrame(animate);
      let now = performance.now();
      if(!gameActive) return;

      let mv = new V3(0,0,0);
      if(keys.w)mv.z-=1;if(keys.s)mv.z+=1;if(keys.a)mv.x-=1;if(keys.d)mv.x+=1;
      mv.normalize().applyQuaternion(playerRig.quaternion); mv.y=0;
      playerRig.position.addScaledVector(mv, 0.35);

      if(now - lastNetSendTime > 33){
        lastNetSendTime = now;
        socket.emit('player_update', {
          x: playerRig.position.x,
          y: playerRig.position.y,
          z: playerRig.position.z,
          yaw: playerYaw,
          pitch: playerPitch
        });

        // Slot 1 (Host) updates authoritative zombies
        if(mySlotNumber === 1){
          if(roundActive && zombiesToSpawnRemaining > 0 && t - lastSpawnTime > spawnInterval){
            spawnZombie((Math.random()-0.5)*20, 0, -100 + (Math.random()-0.5)*40);
            zombiesToSpawnRemaining--;
            lastSpawnTime = t;
          }

          const zombieNetworkPacket = [];
          for(let i=activeZombies.length-1; i>=0; i--){
            const zb = activeZombies[i];
            if(!zb.deadAndShrinking){
              let dir = new V3().subVectors(playerRig.position, zb.mesh.position);
              dir.y = 0; dir.normalize();
              zb.mesh.position.addScaledVector(dir, zb.speed);
              zb.mesh.lookAt(playerRig.position.x, zb.mesh.position.y, playerRig.position.z);
              
              if(zb.mesh.position.distanceTo(playerRig.position) < 2.2){
                damagePlayer();
              }

              zombieNetworkPacket.push({
                x: zb.mesh.position.x,
                y: zb.mesh.position.y,
                z: zb.mesh.position.z,
                yaw: zb.mesh.rotation.y,
                stage: zb.stage
              });
            }
          }
          socket.emit('host_zombie_sync', zombieNetworkPacket);
          checkRoundEnd();
        }
      }

      renderer.render(scene, camera);
    }

    window.addEventListener('resize',()=>{
      camera.aspect=window.innerWidth/window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth,window.innerHeight);
    });

    animate(0);
  </script>
</body>
</html>
