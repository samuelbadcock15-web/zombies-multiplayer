<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The Goody Tonight Show - Live Studio</title>
  <style>
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background-color: #05020a;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #canvas3d { width: 100%; height: 100%; display: block; }
    #crosshair {
      position: absolute; top: 50%; left: 50%; width: 8px; height: 8px;
      background: rgba(255, 255, 255, 0.85); border-radius: 50%;
      transform: translate(-50%, -50%); pointer-events: none;
      box-shadow: 0 0 8px #00f0ff; transition: transform 0.15s; z-index: 10;
    }
    #crosshair.hover-active { transform: translate(-50%, -50%) scale(2.2); background: #ff69b4; }
    #blocker {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(8, 4, 16, 0.9); display: flex; flex-direction: column;
      justify-content: center; align-items: center; color: #fff; z-index: 100; text-align: center;
    }
    #instructions-card {
      background: #1c0a32; border: 3px solid #ff79b0; border-radius: 18px;
      padding: 28px 40px; box-shadow: 0 0 35px rgba(255, 121, 176, 0.35); max-width: 560px; cursor: pointer;
    }
    h1 { color: #ffda66; margin-top: 0; font-size: 1.6rem; letter-spacing: 1.5px; }
    p { color: #ebdcf9; font-size: 0.92rem; line-height: 1.5; margin: 8px 0; }
    .key { background: #391563; padding: 2px 7px; border-radius: 4px; border: 1px solid #9c4dd6; font-weight: bold; color: #ff69b4; }
    #hud {
      position: absolute; top: 18px; left: 20px; background: rgba(22, 9, 44, 0.88);
      border: 2px solid #ff79b0; border-radius: 12px; padding: 12px 18px; color: #fff;
      font-family: monospace; font-size: 0.85rem; pointer-events: none; z-index: 20;
    }
    #countdown-pill { margin-top: 6px; font-weight: bold; color: #ffda66; font-size: 0.95rem; }
    #match-clock-hud { margin-top: 4px; font-weight: bold; color: #00f0ff; font-size: 0.95rem; }
    #audience-pill { margin-top: 4px; font-weight: bold; color: #39ff14; }
  </style>
</head>
<body>
  <div id="crosshair"></div>
  <div id="hud">
    <div class="hud-title" id="mode-title" style="color: #ffda66;">🏠 BEDROOM WORKSHOP</div>
    <div class="hud-sub" id="mode-sub">WebRTC Studio Host: ONLINE • FULL GAME LOOP READY</div>
    <div id="countdown-pill">⏳ BROADCAST STARTS IN: <span id="timer-val" style="color:#ff7675;">10s</span></div>
    <div id="match-clock-hud">⏱️ SHOW CLOCK: <span id="game-clock-val" style="color:#ffda66;">20:00</span></div>
    <div id="audience-pill">👥 AUDIENCE WATCHING: <span id="audience-count" style="color:#39ff14;">1</span></div>
  </div>

  <div id="blocker">
    <div id="instructions-card">
      <h1>The Goody Tonight Show</h1>
      <p>Synchronized tiles & 20-minute race to the finish active!</p>
      <p><strong>Click Anywhere to Enter</strong></p>
      <p><span class="key">W</span> <span class="key">A</span> <span class="key">S</span> <span class="key">D</span> &nbsp;Walk around freely</p>
    </div>
  </div>

  <canvas id="canvas3d"></canvas>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

  <script>
    let currentMode = 'BEDROOM';
    let studioPower = false;

    let showJake = false;
    let showJune = false;

    const videoJake = document.createElement('video');
    videoJake.autoplay = true; videoJake.playsInline = true; videoJake.muted = false;
    const videoJune = document.createElement('video');
    videoJune.autoplay = true; videoJune.playsInline = true; videoJune.muted = false;

    let hasLiveJakeStream = false;
    let hasLiveJuneStream = false;

    let gameState = "IDLE";
    let diceCountdown = 0;
    let diceInterval = null;
    let p1RollVal = null;
    let p2RollVal = null;
    let isDiceRollingP1 = false;
    let isDiceRollingP2 = false;

    let matchTimerSeconds = 20 * 60;
    let matchTimerInterval = null;
    let isTimeExpired = false;
    let gameClockValEl = document.getElementById('game-clock-val');

    let activePlayer = "goody-contestant-1";
    let activeQuestion = null;
    let activeRecap = null;
    let isTieBreakerActive = false;
    let tieBreakerAnswered = false;

    let questionTimer = 0;
    let questionInterval = null;
    let stageSelectedOption = null;
    let stageOptionStatus = null;

    let audienceCount = 1;
    const audienceCountEl = document.getElementById('audience-count');
    const countdownPill = document.getElementById('countdown-pill');
    const timerValEl = document.getElementById('timer-val');

    const contestantRotations = {
      "goody-contestant-1": { yaw: 0, pitch: -0.15 },
      "goody-contestant-2": { yaw: 0, pitch: -0.15 }
    };

    let autoStartSeconds = 10;
    let autoStartInterval = setInterval(() => {
      autoStartSeconds--;
      if (autoStartSeconds > 0) {
        timerValEl.textContent = `${autoStartSeconds}s`;
      } else {
        clearInterval(autoStartInterval);
        countdownPill.innerHTML = `🟢 <span style="color:#39ff14;">LIVE ON AIR!</span>`;
        if (!studioPower) bootStudio();
      }
      renderStageQuestionBoard();
    }, 1000);

    const INTRO_SPEECH = 
      "Hello, good evening, and welcome to The Goody Tonight Show! " +
      "I'm your host, Goody! " +
      "You are now part of the world's first and only televised self-exclusion game show! " +
      "Now, let's meet tonight's contestants! " +
      "Contestant number 1! This is Jake from London! " +
      "And let's meet contestant number 2! This is June from Nottingham! " +
      "Now we need to determine who moves first! " +
      "Contestants, you both have 10 seconds to roll your dice!";

    let currentSubtitle = "STUDIO STANDBY - POWER OFF";

    const COUNTRY_QUESTIONS = {
      "UK": [
        { q: "In the UK, before the 2019 stake reduction, what was the maximum stake per spin on a Fixed-Odds-Betting-Terminal?", options: ["£2", "£50", "£100", "£500"], ans: "£100", recap: "In April 2019, the UK reduced the maximum FOBT stake per spin from £100 down to £2 to combat severe harms." },
        { q: "In the UK, before the 2019 stake reduction, what was the maximum amount a person could stake every 20 seconds on a Fixed-Odds-Betting-Terminal?", options: ["£2 every 20 seconds", "£50 every 20 seconds", "£100 every 20 seconds", "£500 every 20 seconds"], ans: "£100 every 20 seconds", recap: "Prior to 2019, FOBTs permitted £100 every 20 seconds, allowing catastrophic loss speeds." },
        { q: "In the UK, what is the name of the land-based self-exclusion scheme that covers Adult Gaming Centres (Arcades)?", options: ["Bingo Association", "SENSE", "Bacta", "Moses"], ans: "Bacta", recap: "Bacta manages the multi-operator arcade self-exclusion scheme across Great Britain." },
        { q: "In the UK, what is the name of the land-based self-exclusion scheme that covers Casinos?", options: ["Bacta", "SENSE", "Moses", "Bingo Association"], ans: "SENSE", recap: "SENSE allows players to enroll once to be excluded from all UK commercial casinos." },
        { q: "In the UK, what is the name of the land-based self-exclusion scheme that covers Bingo Halls?", options: ["Bingo Association", "SENSE", "Bacta", "SmartExclusion"], ans: "Bingo Association", recap: "The Bingo Association operates the multi-operator exclusion database across land-based bingo premises." },
        { q: "In the UK, what is the name of the land-based self-exclusion scheme that covers Service Stations?", options: ["Bingo Association", "Moses", "Bacta", "SmartExclusion"], ans: "SmartExclusion", recap: "SmartExclusion provides digital exclusion tools across motorway service venues and arcades." },
        { q: "In the UK, what is the name of the land-based self-exclusion scheme that covers Betting Shops (Bookies)?", options: ["Bingo Association", "SENSE", "Bacta", "Moses"], ans: "Moses", recap: "MOSES allows people to self-exclude across high street bookmakers in their chosen localities." },
        { q: "What does the acronym SENSE stand for in the UK's land-based casino self-exclusion scheme?", options: ["Self-Enrollment National Self Exclusion", "Safe Entry National Security Exclusion", "Single Exclusion National Support Exchange", "Social Entertainment National Safety Exchange"], ans: "Self-Enrollment National Self Exclusion", recap: "SENSE stands for Self-Enrollment National Self Exclusion." },
        { q: "In 2025, approximately how many self-excluded people were still able to enter a UK betting shop and gamble?", options: ["668", "3,288", "4,789", "8,700"], ans: "3,288", recap: "Around 3,288 self-excluded individuals were able to enter and gamble in UK betting shop premises." },
        { q: "In which year did the statutory £2 maximum stake on UK FOBTs officially come into force?", options: ["2016", "2017", "2018", "2019"], ans: "2019", recap: "The statutory £2 stake cap officially came into force on April 1st, 2019." }
      ],
      "Canada": [
        { q: "In Ontario, what is the name of the land-based self-exclusion scheme that covers Casinos?", options: ["SENSE", "MyPlay Break", "Bacta", "BetGuard"], ans: "MyPlay Break", recap: "MyPlay Break is Ontario's official casino self-exclusion initiative managed by OLG." },
        { q: "What is the name of Ontario's national online self-exclusion scheme?", options: ["BetGuard", "RUA", "GamStop", "Oasis"], ans: "BetGuard", recap: "BetGuard centralizes online exclusion across licensed iGaming Ontario operators." }
      ],
      "Brazil": [
        { q: "Which country introduced a near total ban on gambling advertising, sponsorship, and promotional communications in 2018?", options: ["United Kingdom", "Italy", "Spain", "None of the above"], ans: "Italy", recap: "Italy introduced a near total ban on all gambling advertising under the 2018 Dignity Decree." },
        { q: "What is the capital city of Brazil?", options: ["Rio de Janeiro", "São Paulo", "Brasília", "Salvador"], ans: "Brasília", recap: "Brasília was inaugurated as the federal capital of Brazil in 1960." },
        { q: "What is the name of Brazil's national online self-exclusion scheme?", options: ["Spelpaus", "Plataforma Centralizada de Autoexclusão", "Rofus", "RGIAJ"], ans: "Plataforma Centralizada de Autoexclusão", recap: "Brazil uses the Plataforma Centralizada de Autoexclusão across its regulated betting system." }
      ],
      "United States": [
        { q: "Which city in Nevada is world-famous for gambling?", options: ["Las Vegas", "Atlantic City", "Macau", "Monte Carlo"], ans: "Las Vegas", recap: "Las Vegas, Nevada is internationally renowned for its casino entertainment corridors." }
      ],
      "Italy": [
        { q: "How does land-based casino self-exclusion work in Italy compared to online RUA?", options: ["One national register covers all casinos", "Players must use individual casino self-exclusion procedures", "RUA automatically blocks all physical venues", "Regional authorities manage separate lists"], ans: "Players must use individual casino self-exclusion procedures", recap: "Unlike digital RUA, Italian physical casinos require separate individual venue enrollments." },
        { q: "What is the name of Italy's national online self-exclusion scheme?", options: ["Spelpaus", "RUA", "GamStop", "Oasis"], ans: "RUA", recap: "RUA (Registro Unico degli Autoesclusi) covers all licensed online platforms in Italy." }
      ],
      "Belgium": [
        { q: "Belgium's EPIS system is an example of which type of self-exclusion model?", options: ["Separate exclusion at every venue", "National centralised self-exclusion register", "Online-only exclusion", "Casino-only exclusion"], ans: "National centralised self-exclusion register", recap: "EPIS is a unified nationwide registry checking IDs across physical and online venues." },
        { q: "What is the name of Belgium's national self-exclusion scheme covering both online and land-based gambling?", options: ["Rofus", "EPIS", "Oasis", "GamStop"], ans: "EPIS", recap: "EPIS (Excluded Persons Information System) covers all regulated gambling in Belgium." }
      ],
      "Germany": [
        { q: "What is the name of Germany's national self-exclusion scheme covering both online and land-based gambling?", options: ["Spelpaus", "Oasis", "Rofus", "GamStop"], ans: "Oasis", recap: "OASIS is Germany's mandatory federal exclusion register across arcades, casinos, and web gaming." }
      ],
      "Denmark": [
        { q: "What is the name of Denmark's national self-exclusion scheme covering both online and land-based gambling?", options: ["Rofus", "Oasis", "GamStop", "EPIS"], ans: "Rofus", recap: "ROFUS is managed by the Danish Gambling Authority to enforce cross-platform player protection." }
      ],
      "Australia": [
        { q: "What is the capital of Australia?", options: ["Melbourne", "Sydney", "Canberra", "Brisbane"], ans: "Canberra", recap: "Canberra is the federal capital territory of Australia." },
        { q: "What is the name of Australia's national online self-exclusion scheme?", options: ["Oasis", "Rofus", "BetStop", "SafePlay"], ans: "BetStop", recap: "BetStop is Australia's National Self-Exclusion Register for licensed online and telephone wagering." },
        { q: "What is Australia's 2023 landmark parliamentary gambling inquiry report commonly known as?", options: ["The Murphy Report", "The Jones Report", "The Harris Report", "The Australian Gambling Reduction Report"], ans: "The Murphy Report", recap: "Chaired by the late Peta Murphy MP, the landmark 2023 inquiry is known as The Murphy Report." }
      ],
      "Nigeria": [
        { q: "What is the capital city of Nigeria?", options: ["Lagos", "Abuja", "Kano", "Port Harcourt"], ans: "Abuja", recap: "Abuja is the federal capital of Nigeria." }
      ],
      "Sweden": [
        { q: "What is the name of Sweden's centralized national self-exclusion system?", options: ["Spelpaus", "ROFUS", "BetStop", "EPIS"], ans: "Spelpaus", recap: "Spelpaus allows individuals in Sweden to block themselves across all licensed gaming." }
      ],
      "France": [
        { q: "What is the national gambling exclusion register called in France?", options: ["Interdictions de Jeux", "Oasis", "RUA", "SENSE"], ans: "Interdictions de Jeux", recap: "Interdictions de Jeux is administered across casinos and licensed online wagering in France." }
      ],
      "Spain": [
        { q: "What is the acronym for Spain's national register of gaming access prohibitions?", options: ["RGIAJ", "RUA", "EPIS", "OASIS"], ans: "RGIAJ", recap: "RGIAJ enforces exclusion across physical and online gaming in Spain." }
      ],
      "Netherlands": [
        { q: "What is the name of the central register for the exclusion of gaming in the Netherlands?", options: ["Cruks", "GamStop", "ROFUS", "Spelpaus"], ans: "Cruks", recap: "Cruks (Centraal Register Uitsluiting Kansspelen) is mandatory across all Dutch gaming operators." }
      ]
    };

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x040208);
    scene.fog = new THREE.FogExp2(0x040208, 0.015);

    const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 150);
    camera.position.set(0, 5.5, 9);

    const canvas = document.getElementById('canvas3d');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.shadowMap.enabled = true;

    const canvasJake = document.createElement('canvas');
    canvasJake.width = 640; canvasJake.height = 360;
    const rendererJake = new THREE.WebGLRenderer({ canvas: canvasJake, antialias: true });

    const canvasJune = document.createElement('canvas');
    canvasJune.width = 640; canvasJune.height = 360;
    const rendererJune = new THREE.WebGLRenderer({ canvas: canvasJune, antialias: true });

    const camJake = new THREE.PerspectiveCamera(65, 16 / 9, 0.1, 100);
    const camJune = new THREE.PerspectiveCamera(65, 16 / 9, 0.1, 100);

    const streamJake = canvasJake.captureStream(30);
    const streamJune = canvasJune.captureStream(30);

    const controls = new THREE.PointerLockControls(camera, document.body);
    const blocker = document.getElementById('blocker');

    blocker.addEventListener('click', () => { initAudio(); controls.lock(); });
    controls.addEventListener('lock', () => { blocker.style.display = 'none'; });
    controls.addEventListener('unlock', () => { blocker.style.display = 'flex'; });

    let studioPeer = null;
    let connectedDataConns = [];
    const connectedAudiencePeers = new Set();

    function initStudioWebRTC() {
      try {
        studioPeer = new Peer("goody-main-studio");

        studioPeer.on('open', (id) => console.log("Master Host Registered:", id));

        studioPeer.on('call', (call) => {
          const isJune = call.metadata && call.metadata.contestant === "goody-contestant-2";
          const returnStream = isJune ? streamJune : streamJake;
          call.answer(returnStream);

          call.on('stream', (remoteStream) => {
            if (isJune) {
              videoJune.srcObject = remoteStream;
              videoJune.muted = false;
              videoJune.play().catch(console.error);
              hasLiveJuneStream = true; showJune = true;
            } else {
              videoJake.srcObject = remoteStream;
              videoJake.muted = false;
              videoJake.play().catch(console.error);
              hasLiveJakeStream = true; showJake = true;
            }
          });
        });

        studioPeer.on('connection', (conn) => {
          connectedDataConns.push(conn);

          conn.on('open', () => {
            connectedAudiencePeers.add(conn.peer);
            broadcastAudienceCount();
          });

          conn.on('data', (data) => {
            if (data.type === "PLAYER_ROLLED_DICE") {
              handlePlayerRoll(data.contestant, data.name, data.roll);
            } else if (data.type === "PLAYER_ANSWERED") {
              if (isTieBreakerActive) {
                handleTieBreakerAnswer(data.contestant, data.chosenAnswer);
                return;
              }
              stageSelectedOption = data.chosenAnswer;
              stageOptionStatus = 'selected';
              renderStageQuestionBoard();

              connectedDataConns.forEach(c => {
                if (c.open) {
                  c.send({
                    type: "OPPONENT_ANSWERED",
                    contestant: data.contestant,
                    chosenAnswer: data.chosenAnswer
                  });
                }
              });

              setTimeout(() => {
                evaluateAnswer(data.contestant, data.chosenAnswer);
              }, 1200);
            } else if (data.type === "PLAYER_TIMEOUT") {
              if (isTieBreakerActive) return;
              handleQuestionTimeout(data.contestant);
            } else if (data.type === "PLUSHIE_MOVE") {
              handlePlushieMovement(data.contestant, data.direction);
            } else if (data.type === "PLUSHIE_LOOK") {
              if (contestantRotations[data.contestant]) {
                contestantRotations[data.contestant].yaw += data.deltaX * 0.005;
                contestantRotations[data.contestant].pitch = Math.max(
                  -0.8,
                  Math.min(0.4, contestantRotations[data.contestant].pitch + data.deltaY * 0.005)
                );
              }
            }
          });

          conn.on('close', () => {
            connectedAudiencePeers.delete(conn.peer);
            connectedDataConns = connectedDataConns.filter(c => c.peer !== conn.peer);
            broadcastAudienceCount();
          });
        });

        studioPeer.on('error', (err) => {
          if (err.type === 'unavailable-id') {
            const viewerPeer = new Peer();
            viewerPeer.on('open', () => {
              const dataConn = viewerPeer.connect("goody-main-studio");
              dataConn.on('data', (data) => {
                if (data.type === "AUDIENCE_COUNT") audienceCountEl.textContent = data.count;
              });
            });
          }
        });

      } catch(e) { console.error(e); }
    }
    initStudioWebRTC();

    function broadcastAudienceCount() {
      audienceCount = Math.max(1, connectedAudiencePeers.size + 1);
      audienceCountEl.textContent = audienceCount;
      connectedDataConns.forEach(c => {
        if (c.open) c.send({ type: "AUDIENCE_COUNT", count: audienceCount });
      });
    }

    let audioCtx = null;
    let goodyUtterance = null;
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      if (videoJake.srcObject) videoJake.play();
      if (videoJune.srcObject) videoJune.play();
    }
    function playTone(freq, type, duration, gainVal = 0.05) {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        g.gain.setValueAtTime(gainVal, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(g); g.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + duration);
      } catch(e) {}
    }

    function speakGoody(text, onComplete) {
      // Broadcast Goody's speech to all mobile devices so contestants hear it
      connectedDataConns.forEach(c => {
        if (c.open) c.send({ type: "HOST_SPEAK", text: text });
      });

      if (!('speechSynthesis' in window)) { if (onComplete) onComplete(); return; }
      window.speechSynthesis.cancel();
      goodyUtterance = new SpeechSynthesisUtterance(text);
      goodyUtterance.rate = 0.95;
      goodyUtterance.pitch = 1.25;
      goodyUtterance.onboundary = (e) => {
        const chunk = text.substring(e.charIndex, e.charIndex + 65);
        currentSubtitle = chunk.length > 55 ? chunk.substring(0, 55) + "..." : chunk;
        playTone(460 + Math.random() * 200, 'triangle', 0.05, 0.02);
      };
      goodyUtterance.onend = () => { if (onComplete) onComplete(); };
      window.speechSynthesis.speak(goodyUtterance);
    }

    function startGoodyMonologue() {
      speakGoody(INTRO_SPEECH, () => {
        beginTenSecondDiceDuel();
      });
    }

    function bootStudio() {
      studioPower = true;
      updateStudioLighting(true);
      updateGoodyFaceExpression();
      updateCameraAlignment();
      renderStageQuestionBoard();
      startGoodyMonologue();
    }

    function beginTenSecondDiceDuel() {
      gameState = "OPENING_DUEL";
      diceCountdown = 10;
      p1RollVal = null;
      p2RollVal = null;
      isDiceRollingP1 = true;
      isDiceRollingP2 = true;

      connectedDataConns.forEach(c => {
        if (c.open) c.send({ type: "START_DICE_COUNTDOWN" });
      });

      if (diceInterval) clearInterval(diceInterval);
      diceInterval = setInterval(() => {
        diceCountdown--;
        if (diceCountdown > 0) {
          playTone(440, 'triangle', 0.08, 0.03);
        } else {
          clearInterval(diceInterval);
          finalizeDiceDuel();
        }
      }, 1000);
    }

    function startTurnDiceCountdown(turnPlayer, pName) {
      diceCountdown = 10;
      if (turnPlayer === "goody-contestant-2") isDiceRollingP2 = true;
      else isDiceRollingP1 = true;

      if (diceInterval) clearInterval(diceInterval);
      diceInterval = setInterval(() => {
        diceCountdown--;
        if (diceCountdown > 0) {
          playTone(440, 'triangle', 0.08, 0.03);
        } else {
          clearInterval(diceInterval);
          const autoVal = Math.floor(Math.random() * 6) + 1;
          handlePlayerRoll(turnPlayer, pName, autoVal);
        }
      }, 1000);
    }

    function handlePlayerRoll(contestant, name, roll) {
      if (gameState === "OPENING_DUEL") {
        if (contestant === "goody-contestant-2") { 
          p2RollVal = roll; isDiceRollingP2 = false; 
        } else { 
          p1RollVal = roll; isDiceRollingP1 = false; 
        }
        playTone(587, 'sine', 0.15, 0.08);

        if (p1RollVal !== null && p2RollVal !== null) {
          clearInterval(diceInterval);
          finalizeDiceDuel();
        }
      } else if (gameState === "IN_PLAY") {
        if (contestant !== activePlayer) return;
        
        if (diceInterval) clearInterval(diceInterval);
        diceCountdown = 0;

        if (contestant === "goody-contestant-2") {
          p2RollVal = roll; isDiceRollingP2 = false;
        } else {
          p1RollVal = roll; isDiceRollingP1 = false;
        }
        playTone(587, 'sine', 0.15, 0.08);

        speakGoody(`${name} rolled a ${roll}! Moving ${roll} spaces.`, () => {
          advanceTurnPlayer(contestant, roll);
        });
      }
    }

    function startTwentyMinuteMatchTimer() {
      if (matchTimerInterval) clearInterval(matchTimerInterval);
      matchTimerInterval = setInterval(() => {
        if (gameState !== "IN_PLAY") return;
        matchTimerSeconds--;

        const mins = Math.max(0, Math.floor(matchTimerSeconds / 60)).toString().padStart(2, '0');
        const secs = Math.max(0, (matchTimerSeconds % 60)).toString().padStart(2, '0');
        const timeStr = `${mins}:${secs}`;
        
        gameClockValEl.textContent = timeStr;
        renderWallClockTexture(timeStr);

        connectedDataConns.forEach(c => {
          if (c.open) c.send({ type: "SYNC_MATCH_TIMER", timeStr: timeStr, secondsLeft: matchTimerSeconds });
        });

        if (matchTimerSeconds <= 0) {
          clearInterval(matchTimerInterval);
          isTimeExpired = true;
          if (!activeQuestion && !activeRecap && !isTieBreakerActive) {
            evaluateFinalShowdown();
          }
        }
      }, 1000);
    }

    function finalizeDiceDuel() {
      if (p1RollVal === null) p1RollVal = Math.floor(Math.random() * 6) + 1;
      if (p2RollVal === null) p2RollVal = Math.floor(Math.random() * 6) + 1;
      isDiceRollingP1 = false;
      isDiceRollingP2 = false;

      if (p1RollVal === p2RollVal) p1RollVal++;

      const winnerNum = p1RollVal > p2RollVal ? 1 : 2;
      activePlayer = winnerNum === 1 ? "goody-contestant-1" : "goody-contestant-2";
      const winRoll = winnerNum === 1 ? p1RollVal : p2RollVal;

      gameState = "IN_PLAY";
      startTwentyMinuteMatchTimer();

      speakGoody(`Contestant number ${winnerNum} wins the roll and goes first! The 20-minute show clock starts now! Moving ${winRoll} spaces.`, () => {
        advanceTurnPlayer(activePlayer, winRoll);
      });
    }

    function advanceTurnPlayer(playerSlot, roll) {
      const isP1 = playerSlot === "goody-contestant-1";
      if (isP1) {
        p1Index = Math.min(boardTileCoords.length - 1, p1Index + roll);
        pawn1.position.set(boardTileCoords[p1Index].x - 0.08, 0.52, boardTileCoords[p1Index].z);
      } else {
        p2Index = Math.min(boardTileCoords.length - 1, p2Index + roll);
        pawn2.position.set(boardTileCoords[p2Index].x + 0.08, 0.52, boardTileCoords[p2Index].z);
      }

      if (p1Index >= boardTileCoords.length - 1 || p2Index >= boardTileCoords.length - 1) {
        triggerFinishLineVictory(isP1 ? "Jake" : "June", isP1 ? "June" : "Jake");
        return;
      }

      const currentTileIdx = isP1 ? p1Index : p2Index;
      const landedCountry = boardTileCoords[currentTileIdx].country;
      const qPool = COUNTRY_QUESTIONS[landedCountry] || COUNTRY_QUESTIONS["UK"];
      const rawQ = qPool[Math.floor(Math.random() * qPool.length)];
      
      activeQuestion = {
        country: landedCountry,
        text: rawQ.q,
        q: rawQ.q,
        options: rawQ.options,
        ans: rawQ.ans,
        recap: rawQ.recap
      };
      activeRecap = null;

      stageSelectedOption = null;
      stageOptionStatus = null;

      const activeName = activePlayer === "goody-contestant-1" ? "Jake" : "June";

      connectedDataConns.forEach(c => {
        if (c.open) c.send({
          type: "SHOW_QUESTION_LOCKED",
          question: activeQuestion,
          activeContestantId: activePlayer,
          activeContestantName: activeName
        });
      });
      renderStageQuestionBoard();

      const speech = `${activeName} landed on ${landedCountry}! Here is your question: ${activeQuestion.q}... You have 30 seconds to lock in!`;
      speakGoody(speech, () => {
        connectedDataConns.forEach(c => {
          if (c.open) c.send({ 
            type: "UNLOCK_QUESTION_INPUT", 
            activeContestantId: activePlayer,
            activeContestantName: activeName 
          });
        });
        startQuestionCountdown();
      });
    }

    function startQuestionCountdown() {
      questionTimer = 30;
      if (questionInterval) clearInterval(questionInterval);
      questionInterval = setInterval(() => {
        questionTimer--;
        renderStageQuestionBoard();
        if (questionTimer <= 0) {
          clearInterval(questionInterval);
          handleQuestionTimeout(activePlayer);
        }
      }, 1000);
    }

    function evaluateAnswer(contestant, chosen) {
      if (questionInterval) clearInterval(questionInterval);
      const isCorrect = chosen === activeQuestion.ans;

      stageOptionStatus = isCorrect ? 'correct' : 'wrong';
      renderStageQuestionBoard();

      connectedDataConns.forEach(c => {
        if (c.open) c.send({
          type: "EVALUATION_RESULT",
          forContestant: contestant,
          chosenAnswer: chosen,
          isCorrect: isCorrect,
          recap: activeQuestion.recap,
          country: activeQuestion.country
        });
      });

      setTimeout(() => {
        activeRecap = { country: activeQuestion.country, text: activeQuestion.recap, isCorrect };
        activeQuestion = null;
        renderStageQuestionBoard();
      }, 1400);

      if (isCorrect) {
        speakGoody(`Well done, that's correct! Here is what we learned: ${activeQuestion.recap}`, () => {
          transitionToRulesAndNextTurn();
        });
      } else {
        speakGoody(`Unlucky, that's incorrect. You must go back to the start! Here is what we learned: ${activeQuestion.recap}`, () => {
          resetPlayerToStart(contestant);
          transitionToRulesAndNextTurn();
        });
      }
    }

    function handleQuestionTimeout(contestant) {
      if (questionInterval) clearInterval(questionInterval);
      stageOptionStatus = 'wrong';
      renderStageQuestionBoard();

      connectedDataConns.forEach(c => {
        if (c.open) c.send({
          type: "EVALUATION_RESULT",
          forContestant: contestant,
          chosenAnswer: null,
          isCorrect: false,
          recap: activeQuestion.recap,
          country: activeQuestion.country
        });
      });

      setTimeout(() => {
        activeRecap = { country: activeQuestion.country, text: activeQuestion.recap, isCorrect: false };
        activeQuestion = null;
        renderStageQuestionBoard();
      }, 1400);

      speakGoody(`I'm sorry, you ran out of time! You must go back to the start! Here is what we learned: ${activeQuestion.recap}`, () => {
        resetPlayerToStart(contestant);
        transitionToRulesAndNextTurn();
      });
    }

    function transitionToRulesAndNextTurn() {
      activeRecap = null;
      activeQuestion = null;
      renderStageQuestionBoard();

      if (isTimeExpired) {
        setTimeout(() => evaluateFinalShowdown(), 2000);
        return;
      }

      setTimeout(() => {
        nextTurn();
      }, 3000);
    }

      if (contestant === "goody-contestant-1") {
        p1Index = 0;
        pawn1.position.set(boardTileCoords[0].x - 0.08, 0.52, boardTileCoords[0].z);
      } else {
        p2Index = 0;
        pawn2.position.set(boardTileCoords[0].x + 0.08, 0.52, boardTileCoords[0].z);
      }
    }

    function nextTurn() {
      if (gameState !== "IN_PLAY") return;

      activePlayer = activePlayer === "goody-contestant-1" ? "goody-contestant-2" : "goody-contestant-1";
      const pName = activePlayer === "goody-contestant-1" ? "Jake" : "June";

      activeQuestion = null;
      activeRecap = null;
      stageSelectedOption = null;
      stageOptionStatus = null;
      p1RollVal = null;
      p2RollVal = null;
      renderStageQuestionBoard();

      speakGoody(`It is now ${pName}'s turn! You have 10 seconds to roll your dice!`, () => {
        startTurnDiceCountdown(activePlayer, pName);

          if (c.open) c.send({

            activeContestantName: pName

    function evaluateFinalShowdown() {
      if (diceInterval) clearInterval(diceInterval);
      if (questionInterval) clearInterval(questionInterval);

      if (p1Index === 0 && p2Index === 0) {
        gameState = "GAME_OVER";
        const speech = "The 20-minute show timer has run out, and both contestants are still on the starting square! Nobody wins tonight, so the prize rolls over to our next game! Thank you for watching The Goody Tonight Show. Shows are at 9 PM most days. Goodnight everyone!";
        speakGoody(speech);
        broadcastGameOver("NOBODY", "ROLLOVER_START_SQUARE");
        return;
      }

      if (p1Index === p2Index) {
        triggerTieBreakerDuel();
        return;
      }

      gameState = "GAME_OVER";
      const winner = p1Index > p2Index ? "Jake" : "June";
      const loser = p1Index > p2Index ? "June" : "Jake";

      const speech = `The 20-minute timer is over! Well done to our winner ${winner}, and commiserations to ${loser}! Thanks for watching, come again next show, shows are at 9 PM most days! Goodnight!`;
      speakGoody(speech);
      broadcastGameOver(winner, "TIME_EXPIRED_LEADER");
    }

    function triggerTieBreakerDuel() {
      isTieBreakerActive = true;

      const rawQ = tiePool[Math.floor(Math.random() * tiePool.length)];
      activeQuestion = {
        country: "TIE-BREAKER",
        text: rawQ.q,
        q: rawQ.q,
        options: rawQ.options,
        ans: rawQ.ans,

      const winner = isCorrect ? answeringName : opponentName;
      const loser = isCorrect ? opponentName : answeringName;

      connectedDataConns.forEach(c => {

          type: "TIE_BREAKER_RESULT",
          winner: winner,
          loser: loser,
          isCorrect: isCorrect,
          chosenAnswer: chosen,
          ans: activeQuestion.ans
        });
      });

      const speech = isCorrect 
        ? `That is correct! Well done to our winner ${winner}, and commiserations to ${loser}! Thanks for watching, come again next show, shows are at 9 PM most days! Goodnight!`
        : `That is incorrect! By default, well done to our winner ${winner}, and commiserations to ${loser}! Thanks for watching, come again next show, shows are at 9 PM most days! Goodnight!`;

      speakGoody(speech);
      broadcastGameOver(winner, "TIE_BREAKER_DECISION");

    function handlePlushieMovement(contestant, direction) {
      const targetPlushie = contestant === "goody-contestant-2" ? playerPlushie2 : playerPlushie1;
      if (!targetPlushie) return;

      const rot = contestantRotations[contestant] ? contestantRotations[contestant].yaw : 0;
      const step = 0.35;

      const fwdX = -Math.sin(rot);
      const fwdZ = -Math.cos(rot);
      const rightX = Math.cos(rot);
      const rightZ = -Math.sin(rot);

      if (direction === 'FORWARD') {
        targetPlushie.position.x += fwdX * step;
        targetPlushie.position.z += fwdZ * step;
      }
      if (direction === 'BACK') {
        targetPlushie.position.x -= fwdX * step;
        targetPlushie.position.z -= fwdZ * step;
      }
      if (direction === 'LEFT') {
        targetPlushie.position.x -= rightX * step;
        targetPlushie.position.z -= rightZ * step;
      }
      if (direction === 'RIGHT') {
        targetPlushie.position.x += rightX * step;
        targetPlushie.position.z += rightZ * step;
      }

      targetPlushie.position.x = Math.max(-6.8, Math.min(6.8, targetPlushie.position.x));
      targetPlushie.position.z = Math.max(-6.8, Math.min(6.8, targetPlushie.position.z));
      targetPlushie.position.y = 0.46;
    }

      ctx.fillStyle = '#e74c3c';
      const dot = (dx, dy) => {
        ctx.beginPath(); ctx.arc(x + dx * size, y + dy * size, size * 0.08, 0, Math.PI * 2); ctx.fill();
      };
      if (value % 2 === 1) dot(0.5, 0.5);
      if (value > 1) { dot(0.25, 0.25); dot(0.75, 0.75); }
      if (value > 3) { dot(0.75, 0.25); dot(0.25, 0.75); }
      if (value === 6) { dot(0.25, 0.5); dot(0.75, 0.5); }
    }

      if (studioPower) {
        autoCam1.headPivot.lookAt(hostHeadPos); autoCam2.headPivot.lookAt(hostHeadPos);
        autoCam1.headPivot.rotation.y += Math.PI; autoCam2.headPivot.rotation.y += Math.PI;
        autoCam1.tallyLamp.material.color.setHex(0xff0000); autoCam2.tallyLamp.material.color.setHex(0xff0000);
      } else {
        autoCam1.headPivot.rotation.set(0.6, 0.2, 0); autoCam2.headPivot.rotation.set(0.6, -0.2, 0);
        autoCam1.tallyLamp.material.color.setHex(0x111111); autoCam2.tallyLamp.material.color.setHex(0x111111);
      }
    }
    scene.add(miniDiorama);

    const move = { forward: false, backward: false, left: false, right: false };
    const velocity = new THREE.Vector3();
    document.addEventListener('keydown', (e) => {
      if (e.code === 'KeyW') move.forward = true; if (e.code === 'KeyS') move.backward = true;
      if (e.code === 'KeyA') move.left = true; if (e.code === 'KeyD') move.right = true;
    });
    document.addEventListener('keyup', (e) => {
      if (e.code === 'KeyW') move.forward = false; if (e.code === 'KeyS') move.backward = false;
      if (e.code === 'KeyA') move.left = false; if (e.code === 'KeyD') move.right = false;
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function syncContestantCameras() {
      const dist = 1.8;
      const height = 1.2;

      if (playerPlushie1) {
        const rot = contestantRotations["goody-contestant-1"];
        playerPlushie1.rotation.y = rot.yaw;

        const worldX = playerPlushie1.position.x;
        const worldY = playerPlushie1.position.y + 3.95;
        const worldZ = playerPlushie1.position.z - 9.0;

        camJake.position.set(
          worldX + Math.sin(rot.yaw) * dist,
          worldY + height,
          worldZ + Math.cos(rot.yaw) * dist
        );

        const lookTarget = new THREE.Vector3(
          worldX - Math.sin(rot.yaw) * 4.0,
          worldY + 0.5 + rot.pitch * 3.0,
          worldZ - Math.cos(rot.yaw) * 4.0
        );
        camJake.lookAt(lookTarget);
      }

      if (playerPlushie2) {
        const rot = contestantRotations["goody-contestant-2"];
        playerPlushie2.rotation.y = rot.yaw;

        const worldX = playerPlushie2.position.x;
        const worldY = playerPlushie2.position.y + 3.95;
        const worldZ = playerPlushie2.position.z - 9.0;

        camJune.position.set(
          worldX + Math.sin(rot.yaw) * dist,
          worldY + height,
          worldZ + Math.cos(rot.yaw) * dist
        );

        const lookTarget = new THREE.Vector3(
          worldX - Math.sin(rot.yaw) * 4.0,
          worldY + 0.5 + rot.pitch * 3.0,
          worldZ - Math.cos(rot.yaw) * 4.0
        );
        camJune.lookAt(lookTarget);
      }
    }

    let prevTime = performance.now();
    function animate() {
      requestAnimationFrame(animate);
      const time = performance.now();
      const delta = Math.min((time - prevTime) / 1000, 0.1);

      renderBackstageScreens();

      if (studioPower) {
        updateCameraAlignment();
        fixtureCyan.target.position.x = -1.2 + Math.sin(time * 0.003) * 1.5;
        fixtureMagenta.target.position.x = 1.2 + Math.cos(time * 0.003) * 1.5;

        miniAudience.children.forEach((p) => {
          if (p !== playerPlushie1 && p !== playerPlushie2) {
            p.position.y = p.userData.initialY + Math.sin(time * 0.006 + p.userData.phase) * 0.04;
          }
        });
      }

      if (controls.isLocked) {
        velocity.x -= velocity.x * 10.0 * delta; velocity.z -= velocity.z * 10.0 * delta;
        const speed = 45.0;
        if (move.forward || move.backward) velocity.z -= (Number(move.forward) - Number(move.backward)) * speed * delta;
        if (move.left || move.right) velocity.x -= (Number(move.right) - Number(move.left)) * speed * delta;
        controls.moveRight(-velocity.x * delta); controls.moveForward(-velocity.z * delta);
      }

      prevTime = time;

      syncContestantCameras();

      if (playerPlushie1) playerPlushie1.visible = false;
      if (playerPlushie2) playerPlushie2.visible = false;
      renderer.render(scene, camera);

      if (showJake) {
        if (playerPlushie1) playerPlushie1.visible = true;
        rendererJake.render(scene, camJake);
        if (playerPlushie1) playerPlushie1.visible = false;
      }

      if (showJune) {
        if (playerPlushie2) playerPlushie2.visible = true;
        rendererJune.render(scene, camJune);
        if (playerPlushie2) playerPlushie2.visible = false;
      }
    }
    animate();
  </script>
</body>
</html>
